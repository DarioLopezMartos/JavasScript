<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="pokemon.css">
</head>

<body>
    <h1>Pokédex</h1>
    <!-- Formulario para buscar un Pokémon. -->
    <form id="formulario-busqueda">
        <label for="nombre-pokemon">Nombre del Pokémon:</label>
        <input type="text" id="nombre-pokemon" name="pokemon" required>
        <button type="submit">Buscar</button>
    </form>

    <!-- Mensajes de estado de la búsqueda. -->
    <p id="estado-busqueda"></p>

    <!-- Listado de Pokémon. -->
    <section>
        <h2>Pokémon</h2>

        <div id="listado-pokemon"></div>
    </section>
    <script src="index.js" defer></script>
</body>

</html>
