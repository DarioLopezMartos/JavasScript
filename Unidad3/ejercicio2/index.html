
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la compra por voz</title>
</head>
<body>
    <h1>Lista de la compra</h1>

    <!-- Botón para comenzar a escuchar. -->
    <button id="iniciarEscucha" type="button">Hablar</button>

    <p id="estado">Inactivo.</p>

    <!-- Último comando reconocido. -->
    <p>Último comando: <span id="ultimoComando">Ninguno</span></p>

    <!-- Lista de productos. -->
    <h2>Productos</h2>
    <ul id="listaCompra"></ul>

    <!-- Alternativa para añadir productos sin voz. -->
    <h2>Añadir manualmente</h2>

    <form id="formularioProducto">
        <label for="producto">Nombre del producto:</label>
        <input type="text" id="producto" placeholder="Ej. leche" required>
        <button type="submit">Añadir producto</button>
    </form>

    <!-- Botón para vaciar la lista. -->
    <button id="vaciarLista" type="button">Vaciar lista</button>

    <!-- Respuesta de la aplicación. -->
    <p id="respuesta"></p>

    <script src="lista.js"></script>
</body>
</html>
